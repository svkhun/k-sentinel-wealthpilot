    // --------------------------------------------------------------------------
    // WEB AUDIO SYNTHESIZER FOR LANDING PAGE
    // --------------------------------------------------------------------------
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    let landingAudioCtx = null;

    function playHaptic(type, isAudioOn = true) {
      if (!isAudioOn) return;
      try {
        if (!landingAudioCtx && AudioContextClass) {
          landingAudioCtx = new AudioContextClass();
        }
        if (!landingAudioCtx) return;
        if (landingAudioCtx.state === "suspended") {
          landingAudioCtx.resume();
        }

        const now = landingAudioCtx.currentTime;

        if (type === "tap") {
          const osc = landingAudioCtx.createOscillator();
          const gain = landingAudioCtx.createGain();
          osc.connect(gain);
          gain.connect(landingAudioCtx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.04);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.05);

        } else if (type === "coin") {
          const freqs = [1046.5, 1318.5, 1567.98, 1975.53];
          freqs.forEach((freq, idx) => {
            const osc = landingAudioCtx.createOscillator();
            const gain = landingAudioCtx.createGain();
            osc.connect(gain);
            gain.connect(landingAudioCtx.destination);
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, now + idx * 0.05);
            gain.gain.setValueAtTime(0.05, now + idx * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.16);
            osc.start(now + idx * 0.05);
            osc.stop(now + idx * 0.05 + 0.18);
          });

        } else if (type === "radar") {
          const osc = landingAudioCtx.createOscillator();
          const gain = landingAudioCtx.createGain();
          osc.connect(gain);
          gain.connect(landingAudioCtx.destination);
          osc.type = "sine";
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(1480, now + 0.18);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.23);

        } else if (type === "alert") {
          const osc = landingAudioCtx.createOscillator();
          const gain = landingAudioCtx.createGain();
          osc.connect(gain);
          gain.connect(landingAudioCtx.destination);
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.setValueAtTime(220, now + 0.12);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
          osc.start(now);
          osc.stop(now + 0.27);

        } else if (type === "success") {
          const osc = landingAudioCtx.createOscillator();
          const gain = landingAudioCtx.createGain();
          osc.connect(gain);
          gain.connect(landingAudioCtx.destination);
          osc.type = "triangle";
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.start(now);
          osc.stop(now + 0.33);
        }
      } catch (e) {
        // audio context restriction
      }
    }

    // --------------------------------------------------------------------------
    // COMPONENT: Reading Scroll Progress Bar

    function ScrollProgressBar() {
      const [progress, setProgress] = useState(0);

      useEffect(() => {
        const handleScroll = () => {
          const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
          if (totalHeight > 0) {
            setProgress((window.scrollY / totalHeight) * 100);
          }
        };
        window.addEventListener("scroll", handleScroll, { passive: true });
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      return (
        <div
          className="fixed top-0 left-0 h-[3.5px] bg-gradient-to-r from-[#00A950] via-teal-400 to-cyan-400 z-[100] transition-all duration-75 shadow-lg shadow-emerald-500/50"
          style={{ width: `${progress}%` }}
        ></div>
      );
    }

    // --------------------------------------------------------------------------
    // COMPONENT: Smooth Animated CountUp
    // --------------------------------------------------------------------------
    function CountUp({ end, decimals = 0, suffix = "", prefix = "", duration = 1400 }) {
      const [value, setValue] = useState(0);

      useEffect(() => {
        let start = 0;
        const stepTime = 25;
        const steps = duration / stepTime;
        const increment = end / steps;
        const timer = setInterval(() => {
          start += increment;
          if (start >= end) {
            setValue(end);
            clearInterval(timer);
          } else {
            setValue(start);
          }
        }, stepTime);
        return () => clearInterval(timer);
      }, [end]);

      return (
        <span>
          {prefix}
          {decimals > 0 ? value.toFixed(decimals) : Math.round(value)}
          {suffix}
        </span>
      );
    }

              </div>
              <h2 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                ทดลองระบบจำลอง K-Sentinel &amp; WealthPilot
              </h2>
              <p className="text-slate-300 text-sm leading-relaxed">
                เปิดแอปแดชบอร์ดเพื่อทดสอบการคำนวณเงินออม Safe-to-Spend, การกวาดเงินเศษเหลือเก็บ และโมเดล AI สกัดกั้นภัยบัญชีม้าด้วยสถิติเรียลไทม์
              </p>
            </div>
            <div className="flex flex-col sm:flex-row gap-3.5 shrink-0 w-full md:w-auto">
              <a
                href="/app"
                onClick={() => playHaptic("tap", isAudioOn)}
                className="inline-flex items-center justify-center gap-2.5 bg-[#00A950] hover:bg-[#008F43] text-white px-8 py-4 rounded-2xl font-extrabold text-sm shadow-xl shadow-emerald-500/30 transition-all hover:scale-105"
              >
                <span>เข้าสู่แอปจำลอง (Launch App)</span>
                <i data-lucide="arrow-right" className="w-4 h-4"></i>
              </a>
            </div>
          </div>
        </section>
      );
    }

    // --------------------------------------------------------------------------
    // COMPONENT: Scam Shield Interception Modal (React Controlled)
    // --------------------------------------------------------------------------
    function ScamShieldModal({ isOpen, onClose, activeCase }) {
      const [secondsLeft, setSecondsLeft] = useState(898);

      useEffect(() => {
        if (!isOpen) return;
        setSecondsLeft(898);
        const timer = setInterval(() => {
          setSecondsLeft(prev => (prev > 0 ? prev - 1 : 0));
        }, 1000);
        return () => clearInterval(timer);
      }, [isOpen]);

      if (!isOpen) return null;

      const m = Math.floor(secondsLeft / 60);
      const s = secondsLeft % 60;
      const formattedTimer = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      const handleFaceScan = () => {
        alert("[BIOMETRIC VERIFIED] สแกนใบหน้าสำเร็จ! ระบบ Biometric Liveness ยืนยันตัวตนผ่าน อนุญาตให้ดำเนินการต่อไปภายใต้การเฝ้าระวังความปลอดภัย");
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fadeIn">
          <div className="glass-card rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-6 border-red-500/40 relative shadow-2xl">
            
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-2xl bg-red-500/20 border border-red-500/40 flex items-center justify-center text-red-400">
                  <i data-lucide="shield-alert" className="w-7 h-7"></i>
                </div>
                <div>
                  <h3 className="text-xl font-extrabold text-white">K-Sentinel สกัดกั้นรายการ</h3>
                  <p className="text-xs text-red-400 font-medium">ตรวจพบบัญชีม้าต้องสงสัยความเสี่ยงสูงมาก</p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-slate-300"
              >
                <i data-lucide="x" className="w-4 h-4"></i>
              </button>
            </div>

            <div className="p-4 rounded-2xl bg-red-950/40 border border-red-500/30 text-sm space-y-2">
              <div className="font-bold text-red-400 flex items-center gap-1.5">
                <i data-lucide="alert-triangle" className="w-4 h-4"></i>
                <span>เหตุผลที่ระบบระงับการโอนเงินชั่วคราว (Counterfactual XAI):</span>
              </div>
              <ul className="text-xs text-slate-300 space-y-1.5 list-disc list-inside">
                <li>บัญชีปลายทาง: <b className="text-white">{activeCase ? activeCase.target : "ACC_0001 (สมชาย - AOC List)"}</b></li>
                <li>จำนวนเงิน: <b className="text-amber-400">{activeCase ? activeCase.amount : "฿ 35,000.00"}</b> สูงผิดปกติจากประวัติการใช้งานของคุณ</li>
                <li>เวลาในการทำรายการตรงกับแบบแผนที่มิจฉาชีพมักกดดันให้เหยื่อโอน (<b className="text-rose-400">{activeCase ? activeCase.urgency : "< 15 วินาที"}</b>)</li>
              </ul>
            </div>

            <div className="p-4 rounded-2xl bg-amber-950/30 border border-amber-500/30 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <i data-lucide="clock" className="w-5 h-5 text-amber-400"></i>
                <div>
                  <div className="text-xs text-slate-400">เวลาดึงสติ (Cool-Off Timer)</div>
                  <div className="text-sm font-bold text-white">กรุณาโทรปรึกษาคนใกล้ชิดก่อนดำเนินการ</div>
                </div>
              </div>
              <span className="font-mono text-xl font-bold text-amber-400">{formattedTimer}</span>
            </div>

            <div className="space-y-3 pt-2">
              <button
                onClick={handleFaceScan}
                className="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/30"
              >
                <i data-lucide="scan-face" className="w-4 h-4"></i>
                <span>ยืนยันด้วยการสแกนใบหน้า (Biometric Liveness)</span>
              </button>

              <button
                onClick={onClose}
                className="w-full py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm border border-white/10"
              >
                ยกเลิกรายการโอนเงิน (ปลอดภัยที่สุด)
              </button>
            </div>

          </div>
        </div>
      );
    }

    // --------------------------------------------------------------------------
    // COMPONENT: Footer
    // --------------------------------------------------------------------------
    function Footer() {
      return (
        <footer className="py-12 bg-[#05080E] border-t border-white/[0.08] text-center text-xs text-slate-400">
          <div className="max-w-7xl mx-auto px-4 space-y-4">
            <div className="flex items-center justify-center gap-2 text-white font-bold text-base">
              <span className="text-[#00A950]">K-Sentinel</span> &amp; <span>WealthPilot</span>
            </div>
            <p>
              นวัตกรรมต้นแบบบน K PLUS สำหรับงาน KBTG Kampus Hackathon 2026 — Track 2: Data Science &amp; Intelligence
            </p>
            <p className="text-slate-500">
              ขับเคลื่อนด้วย HTML, CSS, JavaScript และ React 18
            </p>
          </div>
        </footer>
      );
    }

    // --------------------------------------------------------------------------
    // ROOT APP ORCHESTRATOR
    // --------------------------------------------------------------------------
    function App() {
      const [isScamModalOpen, setIsScamModalOpen] = useState(false);
      const [modalCase, setModalCase] = useState(null);
      const [isAudioOn, setIsAudioOn] = useState(true);

      useLucide();

      const handleOpenModal = (caseItem) => {
        setModalCase(caseItem || null);
        setIsScamModalOpen(true);
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          <ScrollProgressBar />
          <Navbar isAudioOn={isAudioOn} onToggleAudio={() => setIsAudioOn(!isAudioOn)} />
          <main className="flex-1">
            <HeroSection onOpenScamModal={handleOpenModal} isAudioOn={isAudioOn} />
            <MetricsBar />
            <WealthPilotBento isAudioOn={isAudioOn} />
            <KSentinelBento onOpenScamModal={handleOpenModal} isAudioOn={isAudioOn} />
            <ArchitecturePipeline isAudioOn={isAudioOn} />
            <PersonaComparison isAudioOn={isAudioOn} />
            <LaunchAppCTA isAudioOn={isAudioOn} />
          </main>
          <Footer />

          {/* Scam Shield Interactive Modal */}
          <ScamShieldModal
            isOpen={isScamModalOpen}
            activeCase={modalCase}
            onClose={() => setIsScamModalOpen(false)}
          />
        </div>
      );
    }

    // Mount to DOM using React 18 createRoot
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>

</body>
</html>
